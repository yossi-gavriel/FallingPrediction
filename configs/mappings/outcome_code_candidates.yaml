# OUTCOME CODE CANDIDATE LIST (spec §11 M-02, D-09) — UNVALIDATED.
# Every entry below is an UNVALIDATED CANDIDATE mapping of the eFalls WHO ICD-10 outcome list to ICD-9-CM.
# None has clinical sign-off; no reportable scientific run may rely on this file until each entry is
# clinically validated (mapping states, spec §11). Edit only via reviewed change (spec §16).
#
# Semantics used by falls_ml.dataeng.derive (D-09):
#   - codes are normalised by removing '.' and upper-casing; each listed code or range expands to
#     prefixes that match the code and all of its sub-codes (e.g. '820-821' matches 820.x and 821.x);
#   - the LONGEST matching prefix decides the status (e.g. E886.9 REVIEW overrides E880-E886 CANDIDATE);
#   - only status CANDIDATE counts towards the outcome; REVIEW and EXCLUDE codes are tabulated in the
#     pre-modelling audit but never counted;
#   - ICD-9-CM codes are matched only on records declared code_system ICD-9-CM, so undotted E88x never
#     collides with ICD-10 E88.x and E880-E887 never collide with ICD-9 880-887 (open wounds) (M-02).
code_list:
  name: outcome_code_candidates
  version: 0.1.0
  code_system: ICD-9-CM
  status: UNVALIDATED_CANDIDATE
  clinically_validated: false
  validated_by: null
  validation_date: null
  specification: docs/EFALLS_REPRODUCTION_SPEC.md §11 (M-02), §9.9 (D-09)
