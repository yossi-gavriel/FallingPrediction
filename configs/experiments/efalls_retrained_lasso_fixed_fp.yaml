# Meuhedet experiment template (spec v0.2). Dataset path is supplied at run time; dates follow the D-19 proposal and require sign-off.
experiment:
  name: efalls_retrained_lasso_fixed_fp
  kind: efalls_retrained
  description: 'Experiment B co-reported variant (D-13): published functional forms
    (age linear; ln((P+1)/10)) instead of FP re-selection.'
  layers:
  - L1_published
  - L2_assumption
  - L3a_meuhedet_mapping
dataset:
  feature_spec: configs/features/efalls_v1.yaml
  path: null
  require_scientific_use: true
model:
  name: lasso_logistic_cv
  params:
    n_lambda: 100
    selection: min
preprocessing:
  representation: efalls_fp_all_levels
  fractional_polynomial:
    mode: fixed_published
validation:
  strategy: temporal
  seed: 42
  cv_folds: 10
  patients_disjoint: false
  temporal:
    train_end: '2018-12-31'
    validation_end: '2019-12-31'
    embargo_outcome_windows: true
  limitation_note: ''
calibration:
  enabled: true
  method: logistic_intercept_slope
evaluation:
  thresholds:
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  decision_curve_thresholds:
  - 0.01
  - 0.5
  - 0.01
  calibration_groups: 20
  subgroups:
  - sex
  - bmi_category
  - age_band
  bootstrap:
    n: 1000
    seed: 20240314
    cluster_column: research_id
  permutation_importance_repeats: 10
analysis:
  stability:
    enabled: true
    n_bootstrap: 200
    selection_threshold: 0.8
    sign_stability_threshold: 0.9
  optimism:
    enabled: false
    n_bootstrap: 25
  iecv:
    enabled: false
    cluster_column: deprivation_group
reporting:
  enabled: true
  top_n_features: 10
  eligibility:
    min_auroc: 0.7
    calibration_slope_range:
    - 0.8
    - 1.2
    max_abs_citl: 0.2
  risk_categories:
    approved: false
    cutpoints: []
    labels: []
    approval_reference: ''
output:
  runs_dir: runs
