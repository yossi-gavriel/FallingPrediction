# EXAMPLE ONLY — illustrative SAIL-like layout for an eFalls-compatible external extract (spec §13.1).
# Source column names and codes are invented placeholders, NOT a real SAIL or Connected Bradford specification.
# The adapter renames and recodes only; the source environment must already have derived every feature
# (binary indicators, decimal age, polypharmacy count, BMI value, smoking, alcohol, outcome) per spec D-00..D-09.
adapter:
  name: example_sail_like
  version: 0.0.1
  source: example_external_dataset
  example_only: true
column_map:
  ALF_PE: research_id
  INDEX_DT: index_date
  PRED_MAX_RECORD_DT: predictor_max_record_date
  FALL_FRACTURE_12M_FLG: outcome_12m
  FIRST_FALL_FRACTURE_DT: outcome_first_event_date
