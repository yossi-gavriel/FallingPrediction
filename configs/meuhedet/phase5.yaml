# Phase 5.1 (Phase 5 3.0.0) - REPAIR-ONLY METHODOLOGICAL CORRECTION of the Phase 5 2.2.0 run (Experiment 1, docs/phase6/FINAL_CONSENSUS.md and
# docs/phase6/EXPERIMENT1_IMPLEMENTATION_CONTRACT.md): the same question, snapshot, cohort, labels, outer folds (ADOPTED from the completed 2.2.0
# run, hash-verified), seeds, feature-set rules, ENET family, tuning objective, candidate space and budgets - with the methodological defects of
# 2.2.0 corrected and nothing else changed. No Policy B, no new l1 ratio, no new family, no new selection strategy (those are Experiment 2).
# Phase 5 - 2026 REDEVELOPMENT + INCREMENTAL VALUE OF THE NEW V21 INFORMATION (Index_Date 2026-01-01, prediction at the END of the index day).
# INTERNAL NESTED CROSS-VALIDATION ON THE 2026 SNAPSHOT: development data, never called external validation. Phase 4 (temporal validation of the
# frozen Phase 3 models) stays frozen and unused. Every rule below is declared BEFORE any 2026 outcome is analysed; the run records this file's sha256
# (and the V21 schema's) in its plan and refuses to resume with a different one.
#
# PRIMARY QUESTION (management): at approximately the same >= 70% fall sensitivity, does adding the new V21 information reduce the number and the
# percentage of false alerts?   PRIMARY comparison: ENET OLD vs ENET OLD_PLUS_ALL_NEW_ELIGIBLE (pre-declared; LASSO / XGBoost are secondary).
phase5:
  version: 3                                          # Phase 5.1 repair-only settings; the loader refuses a version-2 file
  index_date: "2026-01-01"
  seed: 20261201
  design_label: "INTERNAL NESTED CROSS-VALIDATION ON 2026 SNAPSHOT"
  phase3_config: configs/meuhedet/phase3.yaml          # the Phase 3 feature universe (catalogue, eFalls mapping, time contract, recovery rules) - read only
  v21_schema: configs/meuhedet/phase5_v21_schema.yaml  # the AUTHORITATIVE V21 schema + column-by-column review (with the embedded VIEW definition)

  # ------------------------------------------------------------------ columns that can NEVER enter X (outcome / future / label / follow-up / identifier)
  x_sealing:
    columns: [Fall_Next_30D_Ind, Next_Fall_Date_30D, Days_To_Next_Fall_30D, Next_Fall_Event_ID_30D, Next_Fall_Confidence_30D, Label_Reason_30D,
              Fall_Next_180D_Ind, Next_Fall_Date_180D, Days_To_Next_Fall_180D, Next_Fall_Event_ID_180D, Next_Fall_Confidence_180D, Label_Reason_180D,
              Fall_Next_180D_HighConf_Ind, Fall_Next_30D_HighConf_Ind, Label_End_180D, Label_End_30D, Followup_End_Date, Followup_End_Reason,
              Is_Censored_180D, Is_Censored_30D, Has_Full_Followup_180D, Has_Full_Followup_30D, Has_Full_180D_Label, Has_Full_30D_Label]
    contract_roles: [LABEL, FORBIDDEN_LEAKAGE]          # + every V1-contract column with timing post_index (follow-up, death, censoring)
    schema_classes: [OUTCOME_OR_FUTURE_FORBIDDEN, IDENTIFIER]   # + every extract column the V1 -> V21 diff puts in these classes
    # a column that is in neither the V1 contract nor the V21 schema is sealed when its name matches one of these (case-insensitive) patterns
    name_patterns: ["next", "future", "label", "follow_?up", "censor", "outcome", "days_?to", "after_?index", "post_?index", "death", "deceas",
                    "died", "target", "event_?id", "leakage", "_hit", "within_\\d+d", "_\\d+d_after", "end_date", "discharge", "settle", "invoice_?lag",
                    "billing_?lag", "hidden_?by"]

  # ------------------------------------------------------------------ cohort and the 2026 outcome contract (audited before ANY model is fitted)
  cohort:
    min_eligible_rows: 1000
    stop_if_duplicate_ids: true                       # Customer_Full_ID duplicated among the eligible index-date rows -> HARD STOP (one snapshot per patient)
  outcome_contract:
    label_column: Fall_Next_180D_Ind
    event_date_column: Next_Fall_Date_180D
    days_to_event_column: Days_To_Next_Fall_180D
    window_end_column: Label_End_180D
    reason_column: Label_Reason_180D
    followup_end_column: Followup_End_Date
    window_days: 180
    max_positive_after_followup_share: 0              # ZERO TOLERANCE (must be 0; the loader refuses any other value): ANY positive with its event
                                                      #   after the personal Followup_End_Date -> STOP - REVIEW REQUIRED; aggregate count and % only;
                                                      #   V21 labels allow it by construction - labels are never altered, patients never excluded
    max_label_date_inconsistency_share: 0.001         # positives without an event date / negatives with one: > 0.1% -> STOP
    min_usable_events: 100                            # fewer usable 2026 events -> STOP before training
    warn_usable_share_below: 0.90
    episode_audit: {early_days: 14, recent_fall_days: 30}   # repeated / suspicious fall-record episodes (descriptive)

  # ------------------------------------------------------------------ feature eligibility (label-free except the leakage safety screen)
  eligibility:
    min_known_observed_rows: 100                      # = Phase 3 eligibility.min_observed_train_rows (KNOWN, non-NULL rows of the usable cohort)
    max_unreadable_share: 0.01                        # wrong-type / not-allowed cells: > 1% of the eligible rows -> INELIGIBLE_DATA (old) / _SEMANTICS (new)
    # Phase 5.1 R-1: the 2.2.0 single-feature AUROC >= 0.80 EXCLUSION is REMOVED (it read every label before the folds existed). Membership is
    # decided by the label-free rules of this block only; see `repair` for the per-fold coverage gate and the report-only forensic diagnostic.
    safe_classes: [SAFE_VERIFIED, SAFE_BOUNDED, SAFE_ATTESTED]               # timing classes allowed in OLD and OLD_PLUS_NEW_SAFE (= Phase 3 PRIMARY_FULL)
    all_new_classes: [SAFE_VERIFIED, SAFE_BOUNDED, SAFE_ATTESTED, UNCERTAIN_TIMING]   # OLD_PLUS_ALL_NEW_ELIGIBLE also takes plausibly-at-index,
                                                                             #   non-future predictors whose timing is uncertain
    safe_provenance: [DEFENSIBLE]                     # OLD_PLUS_NEW_SAFE also requires a defensible provenance (no unvalidated raw codes, no
                                                      #   experimental composite)
    old_changed_definition_policy: keep_v21_definition   # a Phase 3 feature whose V1 column changed definition stays with the V21 definition,
                                                         #   flagged, in EVERY feature set (it cannot create an OLD vs NEW difference)

  # ------------------------------------------------------------------ the experiment
  cv: {outer_folds: 5, inner_folds: 5}                # one fixed stratified assignment shared by every model and feature set
  families: [ENET]                                    # Experiment 1 is ENET only (pre-declared); LASSO / XGB code is retained for Experiment 2, not fitted
  primary_family: ENET                                # the PRIMARY verdict comes from ENET only (pre-declared, never chosen after results)
  sets: [OLD, OLD_PLUS_ALL_NEW_ELIGIBLE, OLD_PLUS_NEW_SAFE]
  primary_comparison: [OLD, OLD_PLUS_ALL_NEW_ELIGIBLE]     # the business comparison
  secondary_comparison: [OLD, OLD_PLUS_NEW_SAFE]           # the stricter scientific sensitivity analysis
  domains: [NEW_DIAGNOSIS, NEW_VISION_HEARING, NEW_REGISTRY, NEW_FRAILTY_OR_RISK_PROXY]   # = V21 schema domains (OLD + domain)
  domain_families: []                                 # Phase 5.1: no DOMAIN units (the 2.2.0 run produced the descriptive domain tables once)
  ablations:                                          # ONE registered SECONDARY DIAGNOSTIC: ADMISSIBLE (OLD_PLUS_NEW_SAFE) minus the NEW_REGISTRY domain
    families: [ENET]
    base_set: OLD_PLUS_NEW_SAFE                       # the contrast is taken from the ADMISSIBLE set, never from the legacy ALL set
    remove_each_domain: false
    blocks:
      NO_NEW_REGISTRY: {domains: [NEW_REGISTRY]}      # secondary diagnostic only: it never enters the PRE / POST headline or any verdict
  # domain additions / ablations re-tune linear models in full; XGBoost re-uses the per-fold hyper-parameters of its reference model (OLD for domains)
  # with its own inner early stopping and inner thresholds: only the feature set changes
  derived_tuning: {LASSO: full, ENET: full, XGB: reuse_reference}

  operating:
    primary_sensitivity: 0.70
    targets: [0.50, 0.60, 0.70, 0.75, 0.80, 0.90]
    capacities: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.40, 0.50]   # capacity curve: share of the population that can be contacted (descriptive)
    tie_resolution: 0.0001                            # objective values equal at 0.01 percentage points are tied -> next tie-breaker
  # tuning objective (inner OOF only): the HIGHEST threshold reaching >= 70% sensitivity, then minimise the share flagged; ties -> lower false-alert
  # share -> lower share flagged -> higher AP -> lower Brier -> simpler model

  modes:
    quick:
      lasso: {n_lambda: 10}
      enet: {n_lambda: 8, l1_ratios: [0.2, 0.8]}
      xgb: {n_trials: 4, n_startup_trials: 3}
      bootstrap_n: 200
      stability_linear: 5
      stability_xgb: 3
      permutation_repeats: 2
      shap_rows: 2000
    overnight:                                        # sized on a 48k-patient synthetic run (about 2-4 h on a 6-core workstation; see --estimate)
      lasso: {n_lambda: 60}
      enet: {n_lambda: 40, l1_ratios: [0.1, 0.25, 0.5, 0.75, 0.9]}
      xgb: {n_trials: 100, n_startup_trials: 20}
      bootstrap_n: 2000
      stability_linear: 100
      stability_xgb: 30
      permutation_repeats: 10
      shap_rows: 20000

  # the Phase 1-3 proximal-Newton / coordinate-descent solver (falls_ml.phase2.enet: glmnet penalty on standardised columns, unpenalised
  # intercept, warm-started path); the logarithmic lambda grid runs from lambda_max of the outer-training rows down to lambda_min_ratio x lambda_max
  lasso: {lambda_min_ratio: 1.0e-3, tol: 1.0e-7, max_iter: 10000}
  enet: {lambda_min_ratio: 1.0e-3, tol: 1.0e-7, max_iter: 10000}
  xgb:
    fixed: {objective: "binary:logistic", eval_metric: logloss, tree_method: hist, max_bin: 256, scale_pos_weight: 1.0}
    # scale_pos_weight stays 1: re-weighting the classes distorts the predicted probabilities (Brier, calibration) and the operating point is set by
    # the inner-OOF sensitivity threshold anyway; it is therefore not searched
    n_estimators_max: 2000                            # n_estimators is chosen by early stopping (inner fit / inner early-stopping split only)
    early_stopping_rounds: 50
    early_stopping_fraction: 0.15
    space:
      max_depth: {type: int, low: 2, high: 8}
      learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
      min_child_weight: {type: float, low: 1.0, high: 100.0, log: true}
      subsample: {type: float, low: 0.5, high: 1.0}
      colsample_bytree: {type: float, low: 0.4, high: 1.0}
      reg_alpha: {type: float, low: 1.0e-3, high: 10.0, log: true}
      reg_lambda: {type: float, low: 1.0e-2, high: 100.0, log: true}
      gamma: {type: float, low: 0.0, high: 5.0}

  # ------------------------------------------------------------------ the management decision rule (pre-declared; no minimum delta invented)
  decision:
    calibration_slope_range: [0.80, 1.25]             # = Phase 3 selection.calibration_slope_range
    max_abs_calibration_intercept: 0.20               # = Phase 3 selection.max_abs_citl
    rule: >-
      Computed for every family; the PRIMARY verdict is the ENET one (pre-declared). NEW_FEATURES_OPERATIONALLY_USEFUL only if
      OLD_PLUS_ALL_NEW_ELIGIBLE versus OLD (same patients, folds, outcomes, preprocessing rules, family and tuning budget): (1) has a lower
      false-alert share at the nested, inner-selected 70%-sensitivity operating rule AND at the descriptive pooled-OOF 70% point; (2) the paired
      patient-bootstrap 95% intervals of the difference in false-alert share lie entirely below 0 both at the nested rule and at exactly 70%
      sensitivity (pooled OOF, threshold re-derived in every bootstrap replicate, so threshold placement is part of the uncertainty and the two
      models are compared at the same sensitivity); (3) the false-alert share is lower in EVERY outer
      fold (the bootstrap holds the fitted models fixed, so it cannot see training-to-training variation); (4) the gain does not depend on a
      timing / provenance-questionable predictor: OLD_PLUS_NEW_SAFE (without uncertain-timing, unvalidated-code, renamed or composite predictors)
      also has a lower nested false-alert share than OLD (met when the two sets are identical; a leakage-suspect single predictor never reaches X);
      (5) calibration does not materially degrade: the calibration slope and intercept lie in the Phase 3 ranges or are no further from ideal than
      OLD's, and the Brier-difference interval is not entirely above 0. PROMISING_BUT_NOT_ROBUST: (1) holds and (2) or (3) holds, but not all of
      (1)-(5). NO_ROBUST_OPERATIONAL_GAIN: otherwise (no improvement, or a point improvement supported neither by the interval nor by every fold).
      Answer to "did the V21 information add useful information?" = the ENET verdict: USEFUL -> YES, PROMISING -> UNCERTAIN, NO gain -> NO.
      LASSO and XGBoost verdicts are secondary; the best-performing family is reported as exploratory only. No minimum clinically meaningful
      effect size is assumed.
  subgroups:
    min_events: 50                                     # AUROC / AP / rates only with >= 50 events and >= 50 non-events (descriptive)
    min_nonevents: 50
    mefi_min_coverage: 0.20                            # MEFI-group subgroups only when >= 20% of the cohort has a group
  privacy:
    min_cell: 10
    threshold_grid_step: 0.005                         # share THRESHOLD_TRADEOFF.csv on a 0.5%-of-population grid (never one row per patient)

  resources:
    default_core_share: 0.6                            # default --jobs = 60% of the logical cores (never all), at least 1
    max_default_jobs: 12
    heartbeat_seconds: 30

  # ------------------------------------------------------------------ Phase 5.1 repair (docs/phase6/EXPERIMENT1_IMPLEMENTATION_CONTRACT.md, R-1 ... R-6)
  repair:
    label_free_eligibility_only: true                 # R-1: no outcome-dependent membership decision anywhere
    per_fold_coverage_gate: true                      # R-2: min_known_observed_rows re-applied on each unit's outer-TRAINING rows (label-free)
    inner_lambda_grid: true                           # R-3: lambda_max anchored inside each inner training fold; outer refit re-anchored on outer training
    forensic_auroc_warn: 0.80                         # R-6: training-fold univariate AUROC >= this -> WARN + written adjudication; NEVER an exclusion
    other_level_for_learned_codes: true               # R-5: rare / unseen nominal codes -> explicit `other` level (learned-level codes only)
  feature_overrides:                                  # R-4: applied to an in-memory copy of the Phase 3 catalogue; protected Phase 2 / 3 files untouched
    com_cci_group:
      branch: quarantine                              # quarantine (default) | ordinal (documented ORDER + levels) | nominal (documented meanings + levels)
      reason: "CCI_Group dictionary not supplied by the DWH before registration: raw population-record group code with undocumented order / spacing"
  negative_controls:                                  # R-12: frozen-fold label permutations on the real data BEFORE PRIMARY (quick budget, ENET, ADMISSIBLE)
    seeds: 10                                         # 10 fixed seeds (synthetic / test runs may override; a real run requires all 10)
    capacity_permille: 30                             # Recall@Top3 is read at the 3% operating capacity (within-fold allocation, row-key ties)
    max_mean_auroc: 0.55                              # registered sanity-stop thresholds (fixed; the loader refuses any other value):
    max_mean_recall_top3: 0.05                        #   mean AUROC > 0.55 OR mean Recall@Top3 > 5% over the seeds -> STOP NEGATIVE_CONTROL_FAILED
    set: OLD_PLUS_NEW_SAFE
    family: ENET
    mode: quick
  pre_run:                                            # R-10: the completed 2.2.0 run is REQUIRED on real data and verified before anything is fitted
    required: true
    verify: [plan_complete, input_sha256, cohort_and_labels, fold_hashes_adopted, enet_units_complete, top3_capacity_table_reproduced]
    comparator_set: OLD_PLUS_NEW_SAFE                 # ADMISSIBLE = the existing OLD_PLUS_NEW_SAFE (PI decision); the primary PRE / POST arms are OLD and ADMISSIBLE
    audit_set: OLD_PLUS_ALL_NEW_ELIGIBLE              # legacy ALL: audit / exploratory only
