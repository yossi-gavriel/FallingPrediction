# The VIEW is an immutable research source; this file is the adapter's contract ABOVE it. Nothing here is derived from row data.
#
# Per column:
#   sql       SQL Server type from the DDL            nullable  DDL nullability (true = NULL allowed)
#   role      exactly one of contract.roles           sem       canonical semantic type (contract.semantic_types)
#   model     final model-matrix dtype, or never      timing    when the value is knowable (pre_index/at_index/post_index/unknown/na)
#   allowed   allowed values for binary/ordinal/categorical columns (audit reports anything else as invalid)
#   null_means business meaning of NULL (never converted silently); group = Phase-2 feature group; note = decision rationale
#   sentinels  declared business sentinel dates (ISO, quoted) of a date column, kept as dates in the contract layer; sentinel_means = their
#              meaning (required); sentinel_modeling_rule keep (default: the build stops if a modelling-layer column cannot hold the value)
#              or to_null (NULL in the modelling layer only, counted in the build report). Undeclared far-future dates are reported, never repaired.
# Rules enforced by falls_ml.data.meuhedet_wide.load_wide_contract: every column has a role; predictor roles need timing pre_index
# or at_index; LABEL/FORBIDDEN_LEAKAGE/QA_CONTROL/IDENTIFIER/COHORT columns can never enter a model matrix (model: never).
contract:
  name: meuhedet_wide_v1
  version: 1.0.0
  source_view: "[Meuhedet_DWH].[dbo].[V_Falls_Prediction_Wide_1]"
  definition_version: V1.0
  n_columns: 221
  one_row_per: [Customer_Full_ID, Index_Date]
