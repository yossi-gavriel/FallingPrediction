  semantic_types: [identifier, date, binary, continuous, count, categorical, ordinal, quality_control, label]
  model_dtypes: [never, float64, int8_binary, onehot_categorical, ordinal_float64]
  timings: [pre_index, at_index, post_index, unknown, na]
  phase2_groups: [PRIOR_FALLS_ENHANCED, DIAGNOSIS_BURDEN, HEALTHCARE_UTILIZATION, NURSE_FALL_ASSESSMENT, MOBILITY_ADL, COGNITION,
                  HOME_SAFETY, MEDICATION_ENHANCED, REGISTRY_ENHANCED, MEFI_FRAILTY, COMORBIDITY_SOCIAL]
  # Source date layouts accepted when a date column arrives as text (CSV / Excel text cells), tried in this order. They are
  # declared, never inferred: 01/02/2024 is always 1 February 2024 under %d/%m/%Y. The loader refuses a set in which two formats
  # would read the same text as different dates (e.g. %d/%m/%Y together with %m/%d/%Y). Real Excel/Parquet date cells are used as they are.
  date_formats: ["%Y-%m-%d", "%d/%m/%Y"]
  sql_to_pandas:   # raw type -> pandas dtype used when reading the extract (no inference)
    int: Int64
    smallint: Int64
    tinyint: Int64
    bit: Int64
    decimal: float64
    date: datetime64[us]       # the full SQL date range (0001..9999, e.g. the 2999-12-31 open-ended sentinel); only the canonical
    datetime: datetime64[us]   # modelling dates (index_date, predictor_max_record_date, event/death/follow-up dates) are cast to datetime64[ns]
    varchar: string
