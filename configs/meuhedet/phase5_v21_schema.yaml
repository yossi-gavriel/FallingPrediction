    REGISTRIES: {risk: HIGH, assumption: memberships can be created after clinical review with an earlier start date (backdating) (Phase 3 time contract)}
    COMPOSITE: {risk: HIGH, assumption: inherits the registry backdating risk and the unbounded medication purchase status}
