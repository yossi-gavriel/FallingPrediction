# Phase 5 - the AUTHORITATIVE V21 / 2026 schema and its column-by-column review against the V1 contract (source of truth for the 2026 extract).
# Generated from the review; every V21 column has exactly one entry. The loader verifies that the column list equals the header and the SELECT
# list of the embedded definition file (sha256 below) and recomputes the V1 -> V21 diff programmatically from the V1 contract and the REAL
# extract header at every preflight; this file only supplies the SEMANTIC conclusions (equivalence evidence, notes, new-column definitions).
#   shared columns:  v1_equivalence DOCUMENTED_MATCH | CLARIFIED_NO_CONFLICT | CHANGED (+ note)
#   new columns:     new.role PREDICTOR | METADATA_OR_ADMIN | IDENTIFIER | OUTCOME_OR_FUTURE_FORBIDDEN; a PREDICTOR declares domain, source, kind,
#                    missing (no_event | not_assessed | unexpected), timing (record_date | attested | uncertain), provenance (DEFENSIBLE |
#                    UNVALIDATED_CODES | PROBABLE_RENAME_OF_V1 | EXPERIMENTAL_COMPOSITE) and, for a renamed column, replaces: <V1 column>
phase5_v21_schema:
  version: 1.0.0
  status: AUTHORITATIVE V21 SCHEMA (header + business definitions supplied by the user, 2026-10-04) + the Phase 5 column-by-column review against the V1 contract (configs/meuhedet/wide_v1_columns.yaml)
    and data dictionary (wide_v1_data_dictionary.yaml). Written without any row of real data.
  source_view: '[Meuhedet_DWH].[dbo].[V_Falls_Prediction_Wide_3] (definition V21; the definition file creates V_Falls_Prediction_Wide - the extracted object must implement the same definition)'
  definition_file: configs/meuhedet/phase5_v21_view_definition.txt
