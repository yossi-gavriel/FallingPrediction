  n_columns: 224
  study: {study_start: '2022-01-01', index_date: '2026-01-01', study_end: '2026-08-01', history_window: date >= Index_Date - N and <= Index_Date (both ends inclusive), label_window: date > Index_Date and
      <= Label_End (depends also on the source time of day)}
  global_caveats: ['medication exposure is a proxy from prescription / purchase, not proof of intake; exposure starts at the prescription date; there is NO Last_Purchased_Date <= Index_Date filter', visit-row
      counters update; billing / discharge information may leak from the future, Leakage_Check_Ind checks four dates only and does not rule out leakage, 'labels are not limited to the personal Followup_End_Date:
      a positive can appear after the personal follow-up end; a negative requires full personal follow-up by the code, not full study coverage', fall / fracture = diagnosis records (code 888 or prefixes
      820/821/813/812/808); repeated records may document follow-up of the same event, 'a diagnosis / registry flag 0 means no matching code was found, not proof of absence', registry flags use validity
      dates without a STATUS filter]
  equivalence_evidence: {DOCUMENTED_MATCH: the V1 contract / data dictionary DOCUMENTED the meaning and the V21 definition agrees with it, CLARIFIED_NO_CONFLICT: 'V1 had only a name-level (or unknown) meaning;
      the V21 definition documents the computation and contradicts neither the V1 contract (type, allowed values, window, timing) nor a documented V1 meaning', CHANGED: 'the V21 definition is incompatible
      with the V1 contract or redefines the quantity: OLD_CHANGED_DEFINITION'}
  domains:
    NEW_DIAGNOSIS: {label: new diagnosis-derived predictors (neurological / balance / bone), label_he: אבחנות חדשות (נוירולוגיה / שיווי משקל / עצם)}
    NEW_VISION_HEARING: {label: new vision / hearing diagnoses, label_he: אבחנות ראייה / שמיעה חדשות}
    NEW_REGISTRY: {label: new registry flags and sub-codes, label_he: רשמים חדשים}
    NEW_REGISTRY_RELABELLED: {label: 'registry flags that replace a removed V1 registry column (probable rename, corrected meaning)', label_he: רשמים שהחליפו עמודת רשם של V1 (שינוי שם ומשמעות)}
    NEW_FRAILTY_OR_RISK_PROXY: {label: experimental deficit-count proxy, label_he: מדד ליקויים ניסויי}
  availability:
